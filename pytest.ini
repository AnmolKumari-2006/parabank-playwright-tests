[pytest]
# Folder that contains all tests
testpaths = tests
# Lets tests import config, pages and utils from the project root
pythonpath = .

# Default options for every run:
#   --browser (x3)  : every UI test runs on Chromium, Firefox and WebKit
#   --base-url      : ParaBank built from its source and running locally (run_parabank.bat).
#                     For the public site add: --base-url https://parabank.parasoft.com/parabank/
#   --screenshot    : screenshot of failed tests only, in test-results (not in the report)
#   video / trace   : kept for failed tests only
#   --alluredir     : results for the Allure HTML report (build it with: npx allure generate allure-results)
#   reports/test_suite_report.html is written by conftest.py after every run
addopts =
    --browser chromium
    --browser firefox
    --browser webkit
    --base-url http://localhost:8080/parabank/
    --screenshot only-on-failure
    --video retain-on-failure
    --tracing retain-on-failure
    --output test-results
    --alluredir=allure-results
    --clean-alluredir

markers =
    e2e: end-to-end UI tests of the 4 chosen features
    api: REST API tests (CRUD), browser independent
    mocking: network mocking tests (fake empty data or server error)